<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      @keyframes blink {
        0%, 88%, 100% { transform: scaleY(1); }
        94% { transform: scaleY(0.1); }
      }
      @keyframes look {
        0%, 35%, 100% { transform: translate(0px, 0px); }
        45%, 60% { transform: translate(-2.5px, 0px); }
        70%, 85% { transform: translate(2.5px, 0px); }
      }
      @keyframes earL {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-5deg); }
      }
      @keyframes earR {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(5deg); }
      }
      .ear-left {
        transform-origin: 20px 20px;
        animation: earL 3s ease-in-out infinite;
      }
      .ear-right {
        transform-origin: 44px 20px;
        animation: earR 3s ease-in-out infinite;
      }
      .eyes-group {
        transform-origin: 32px 25px;
        animation: blink 3.2s infinite;
      }
      .pupils-group {
        animation: look 4.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Squircle Modern Badge -->
  <rect width="64" height="64" rx="16" fill="#0f172a"/>
  
  <!-- Left Ear -->
  <polygon class="ear-left" points="16,22 23,8 27,22" fill="#2563eb"/>
  <!-- Right Ear -->
  <polygon class="ear-right" points="48,22 41,8 37,22" fill="#2563eb"/>
  
  <!-- Body -->
  <ellipse cx="32" cy="38" rx="20" ry="19" fill="#1e293b"/>
  
  <!-- Belly -->
  <path d="M 21,38 Q 32,32 43,38 Q 43,53 32,53 Q 21,53 21,38 Z" fill="#334155" opacity="0.7"/>
  <path d="M 27,42 Q 32,45 37,42 M 28,47 Q 32,50 36,47" stroke="#60a5fa" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  
  <!-- Head -->
  <ellipse cx="32" cy="26" rx="17" ry="14" fill="#2563eb"/>
  
  <!-- Eyes Group with Blink Animation -->
  <g class="eyes-group">
    <!-- Left Eye White -->
    <circle cx="25" cy="25" r="6.8" fill="#ffffff"/>
    <!-- Right Eye White -->
    <circle cx="39" cy="25" r="6.8" fill="#ffffff"/>
    
    <!-- Moving Pupils -->
    <g class="pupils-group">
      <!-- Left Pupil -->
      <circle cx="25" cy="25" r="3.6" fill="#0f172a"/>
      <circle cx="23.7" cy="23.7" r="1.3" fill="#ffffff"/>
      
      <!-- Right Pupil -->
      <circle cx="39" cy="25" r="3.6" fill="#0f172a"/>
      <circle cx="37.7" cy="23.7" r="1.3" fill="#ffffff"/>
    </g>
  </g>
  
  <!-- Beak -->
  <polygon points="32,29 28.5,34.5 35.5,34.5" fill="#f59e0b"/>
  
  <!-- Feet -->
  <ellipse cx="26" cy="56" rx="3.5" ry="2" fill="#f59e0b"/>
  <ellipse cx="38" cy="56" rx="3.5" ry="2" fill="#f59e0b"/>
</svg>

